name: docmind

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docmind-db
    restart: unless-stopped
    # PRODUCTION-SENSITIVE: override POSTGRES_PASSWORD with a strong secret
    # (never the dev default) when deploying anywhere shared.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmind_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-docmind}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: docmind-backend
    restart: unless-stopped
    environment:
      # The host part is `db` (compose service name) inside the Docker network.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docmind}:${POSTGRES_PASSWORD:-docmind_dev_password}@db:5432/${POSTGRES_DB:-docmind}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # PRODUCTION-SENSITIVE: set a strong random SECRET_KEY and a real
      # GEMINI_API_KEY via the environment before exposing the app.
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      STORAGE_DIR: ${STORAGE_DIR:-storage}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-20971520}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.65}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-8000}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-2000}
      DENSE_CANDIDATE_K: ${DENSE_CANDIDATE_K:-20}
      BM25_CANDIDATE_K: ${BM25_CANDIDATE_K:-20}
      RERANK_TOP_K: ${RERANK_TOP_K:-8}
      HYBRID_DENSE_WEIGHT: ${HYBRID_DENSE_WEIGHT:-0.6}
      HYBRID_BM25_WEIGHT: ${HYBRID_BM25_WEIGHT:-0.4}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-8}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.35}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Public demo mode: build the demo index once with
      # `docker compose exec backend python -m scripts.build_demo_index`,
      # then set DEMO_MODE=true to expose the no-upload public demo.
      # The default DEMO_DOCUMENT_PATH (../Doc/…) resolves to the mounted
      # ./Doc directory inside the container, so the demo PDF is always present.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_DOCUMENT_PATH: ${DEMO_DOCUMENT_PATH:-../Doc/DocMind_Public_Demo_Test_Document.pdf}
      DEMO_DOCUMENT_ID: ${DEMO_DOCUMENT_ID:-11111111-1111-4111-8111-111111111111}
      DEMO_DOCUMENT_TITLE: ${DEMO_DOCUMENT_TITLE:-DocMind Public Demo Test Document}
    ports:
      - "8000:8000"
    volumes:
      # Bind mount enables hot-reload during development.
      - ./backend:/app
      # Make the demo PDF reachable inside the container at /Doc (read-only),
      # matching the default DEMO_DOCUMENT_PATH=../Doc/… from /app.
      - ./Doc:/Doc:ro
    depends_on:
      db:
        condition: service_healthy
    # Apply pending migrations, then start the API with reload.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: docmind-frontend
    restart: unless-stopped
    environment:
      # Browsers call the API from the host, so localhost works for local dev.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules so the host filesystem cannot shadow it.
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
