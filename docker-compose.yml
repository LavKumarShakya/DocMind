name: docmind

# Self-hosted production stack for the full DocMind application.
#
#   Browser
#      |
#      v
#   frontend :3000 ──► backend :8000 ──► PostgreSQL :5432 (internal only)
#
# PostgreSQL is NOT exposed to the host; only the frontend (3000) and backend
# (8000) ports are published. All state lives in named volumes so data
# survives `docker compose down` / container recreation:
#
#   - pgdata           : PostgreSQL database
#   - backend_storage  : uploaded documents (backend STORAGE_DIR)
#   - hf_cache         : Hugging Face model cache (BGE + cross-encoder)
#
# The public demo (Phase 9) is enabled by setting DEMO_MODE=true after building
# the demo index once (`docker compose exec backend python -m scripts.build_demo_index`).
# The read-only ./Doc mount keeps the demo PDF reachable inside the container.
# DEMO_MODE defaults to false: the full authenticated upload/chat workflow.
#
# Usage:
#   cp .env.example .env        # then set SECRET_KEY, POSTGRES_PASSWORD, GEMINI_API_KEY
#   docker compose up -d --build
#   open http://localhost:3000

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docmind-db
    restart: unless-stopped
    # PRODUCTION-SENSITIVE: override POSTGRES_PASSWORD with a strong secret
    # (never the dev default) when deploying anywhere shared.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmind_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-docmind}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: docmind-backend
    restart: unless-stopped
    environment:
      # The host part is `db` (compose service name) inside the Docker network.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docmind}:${POSTGRES_PASSWORD:-docmind_dev_password}@db:5432/${POSTGRES_DB:-docmind}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # PRODUCTION-SENSITIVE: set a strong random SECRET_KEY and a real
      # GEMINI_API_KEY via the environment before exposing the app.
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      # Persistent document storage and HF model cache (named volumes below).
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      HF_HOME: ${HF_HOME:-/data/huggingface}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-20971520}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.65}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-8000}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-2000}
      DENSE_CANDIDATE_K: ${DENSE_CANDIDATE_K:-20}
      BM25_CANDIDATE_K: ${BM25_CANDIDATE_K:-20}
      RERANK_TOP_K: ${RERANK_TOP_K:-8}
      HYBRID_DENSE_WEIGHT: ${HYBRID_DENSE_WEIGHT:-0.6}
      HYBRID_BM25_WEIGHT: ${HYBRID_BM25_WEIGHT:-0.4}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-8}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.35}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Public demo mode (Phase 9): build the demo index once with
      # `docker compose exec backend python -m scripts.build_demo_index`,
      # then set DEMO_MODE=true to expose the no-upload public demo.
      # The default DEMO_DOCUMENT_PATH (../Doc/…) resolves to the mounted
      # ./Doc directory inside the container, so the demo PDF is always present.
      # Leave DEMO_MODE=false for the full authenticated upload/chat workflow.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_DOCUMENT_PATH: ${DEMO_DOCUMENT_PATH:-../Doc/DocMind_Public_Demo_Test_Document.pdf}
      DEMO_DOCUMENT_ID: ${DEMO_DOCUMENT_ID:-11111111-1111-4111-8111-111111111111}
      DEMO_DOCUMENT_TITLE: ${DEMO_DOCUMENT_TITLE:-DocMind Public Demo Test Document}
    ports:
      # Published so the browser (served by the frontend) can call the API.
      - "8000:8000"
    volumes:
      # Persistent upload storage and HF model cache (named volumes).
      - backend_storage:/data/storage
      - hf_cache:/data/huggingface
      # Make the demo PDF reachable inside the container at /Doc (read-only),
      # matching the default DEMO_DOCUMENT_PATH=../Doc/… from /app.
      - ./Doc:/Doc:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Apply pending migrations, then start the API with a single worker.
    # (No --reload: production image. One worker: models are in-process singletons.)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1"

  frontend:
    build:
      context: ./frontend
      # Baked into the client bundle at build time (NEXT_PUBLIC_*).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: docmind-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    # The production frontend runs `npm start`; no source bind mount.

volumes:
  pgdata:
  backend_storage:
  hf_cache:
